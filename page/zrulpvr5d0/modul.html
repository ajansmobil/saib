<style>
  .yk-sube-modul {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 1.25rem;
    font-family: inherit;
    color: inherit;
  }
  .yk-sube-modul .yk-baslik-wrap {
    text-align: center;
    margin-bottom: 2rem;
  }
  .yk-sube-modul .yk-baslik {
    margin: 0 0 0.5rem 0;
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: inherit;
  }
  .yk-sube-modul .yk-baslik-cizgi {
    display: inline-block;
    width: 56px;
    height: 4px;
    margin: 0 auto;
    background: currentColor;
    opacity: 0.35;
    border-radius: 2px;
  }
  .yk-sube-modul .yk-intro {
    max-width: 36em;
    margin: 0 auto 2.5rem;
    text-align: center;
    line-height: 1.75;
    font-size: 1.05rem;
    opacity: 0.88;
  }
  .yk-sube-modul .yk-bolum-baslik {
    margin: 0 0 1.5rem 0;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: inherit;
    opacity: 0.7;
  }
  .yk-sube-modul .yk-sube-listesi {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  @media (min-width: 640px) {
    .yk-sube-modul .yk-sube-listesi {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .yk-sube-modul .yk-sube-karti {
    position: relative;
    padding: 1.75rem 1.5rem;
    border-radius: 12px;
    background: rgba(0,0,0,0.03);
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
    overflow: hidden;
  }
  .yk-sube-modul .yk-sube-karti::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: currentColor;
    opacity: 0.2;
    border-radius: 4px 0 0 4px;
  }
  .yk-sube-modul .yk-sube-karti:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    border-color: rgba(0,0,0,0.1);
  }
  .yk-sube-modul .yk-sube-karti:last-child {
    margin-bottom: 0;
  }
  .yk-sube-modul .yk-sube-isim {
    margin: 0 0 1rem 0;
    padding-right: 0.5rem;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.01em;
    color: inherit;
  }
  .yk-sube-modul .yk-meta {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .yk-sube-modul .yk-meta-satir {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .yk-sube-modul .yk-meta-ikon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    opacity: 0.9;
  }
  .yk-sube-modul .yk-meta-metin {
    flex: 1;
    opacity: 0.9;
  }
  .yk-sube-modul .yk-sube-tel a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.85rem;
    margin-top: 0.25rem;
    font-size: 1rem;
    font-weight: 600;
    color: inherit;
    text-decoration: none;
    border-radius: 8px;
    background: rgba(0,0,0,0.06);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .yk-sube-modul .yk-sube-tel a:hover {
    background: rgba(0,0,0,0.1);
  }
</style>

<section class="yk-sube-modul">
  <div class="yk-baslik-wrap">
    <h1 class="yk-baslik">{{title}}</h1>
    <div class="yk-baslik-cizgi" aria-hidden="true"></div>
  </div>
  <p class="yk-intro">{{intro}}</p>

  <h2 class="yk-bolum-baslik">{{section_branches}}</h2>
  <ul class="yk-sube-listesi">
    <li class="yk-sube-karti">
      <h3 class="yk-sube-isim">{{branch_1_name}}</h3>
      <div class="yk-meta">
        <div class="yk-meta-satir">
          <span class="yk-meta-ikon" aria-hidden="true">&#128205;</span>
          <span class="yk-meta-metin">{{branch_1_location}}</span>
        </div>
        <div class="yk-meta-satir">
          <span class="yk-meta-ikon" aria-hidden="true">&#128222;</span>
          <span class="yk-meta-metin yk-sube-tel"><a href="tel:{{branch_1_phone_raw}}">{{branch_1_phone}}</a></span>
        </div>
      </div>
    </li>
    <li class="yk-sube-karti">
      <h3 class="yk-sube-isim">{{branch_2_name}}</h3>
      <div class="yk-meta">
        <div class="yk-meta-satir">
          <span class="yk-meta-ikon" aria-hidden="true">&#128205;</span>
          <span class="yk-meta-metin">{{branch_2_location}}</span>
        </div>
        <div class="yk-meta-satir">
          <span class="yk-meta-ikon" aria-hidden="true">&#128222;</span>
          <span class="yk-meta-metin yk-sube-tel"><a href="tel:{{branch_2_phone_raw}}">{{branch_2_phone}}</a></span>
        </div>
      </div>
    </li>
  </ul>
</section>

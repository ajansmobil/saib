<style>
  .yk-sube-modul {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1rem;
    font-family: inherit;
    color: inherit;
  }
  .yk-sube-modul .yk-baslik {
    margin: 0 0 1.25rem 0;
    font-size: 1.65rem;
    font-weight: 700;
    line-height: 1.3;
    border-bottom: 2px solid rgba(0,0,0,0.08);
    padding-bottom: 0.75rem;
  }
  .yk-sube-modul .yk-intro {
    margin: 0 0 2rem 0;
    line-height: 1.7;
    font-size: 1rem;
    opacity: 0.9;
  }
  .yk-sube-modul .yk-ayirici {
    border: none;
    border-top: 1px solid rgba(0,0,0,0.1);
    margin: 2rem 0;
  }
  .yk-sube-modul .yk-bolum-baslik {
    margin: 0 0 1rem 0;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: inherit;
    opacity: 0.9;
  }
  .yk-sube-modul .yk-sube-listesi {
    margin: 0;
    padding-left: 0;
    list-style: none;
  }
  .yk-sube-modul .yk-sube-karti {
    margin-bottom: 1.5rem;
    padding: 1.25rem 1rem;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 8px;
    background: rgba(0,0,0,0.02);
  }
  .yk-sube-modul .yk-sube-karti:last-child {
    margin-bottom: 0;
  }
  .yk-sube-modul .yk-sube-isim {
    margin: 0 0 0.5rem 0;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.4;
    color: inherit;
  }
  .yk-sube-modul .yk-sube-adres {
    margin: 0 0 0.5rem 0;
    font-size: 0.95rem;
    line-height: 1.5;
    opacity: 0.9;
  }
  .yk-sube-modul .yk-sube-tel {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
  }
  .yk-sube-modul .yk-sube-tel a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .yk-sube-modul .yk-sube-tel a:hover {
    text-decoration: underline;
  }
</style>

<section class="yk-sube-modul">
  <h1 class="yk-baslik">{{title}}</h1>
  <p class="yk-intro">{{intro}}</p>

  <hr class="yk-ayirici" />

  <h2 class="yk-bolum-baslik">{{section_branches}}</h2>
  <ul class="yk-sube-listesi">
    <li class="yk-sube-karti">
      <h3 class="yk-sube-isim">{{branch_1_name}}</h3>
      <p class="yk-sube-adres">{{branch_1_location}}</p>
      <p class="yk-sube-tel"><a href="tel:{{branch_1_phone_raw}}">{{branch_1_phone}}</a></p>
    </li>
    <li class="yk-sube-karti">
      <h3 class="yk-sube-isim">{{branch_2_name}}</h3>
      <p class="yk-sube-adres">{{branch_2_location}}</p>
      <p class="yk-sube-tel"><a href="tel:{{branch_2_phone_raw}}">{{branch_2_phone}}</a></p>
    </li>
  </ul>
</section>

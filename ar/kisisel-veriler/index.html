<script>
  if (typeof menu3_toggle === "undefined") {
    function menu3_toggle() {
      var root = document.getElementById("menu-3-root");
      if (!root) {
        return;
      }
      if (root.classList.contains("wauxmmenu-open")) {
        root.classList.remove("wauxmmenu-open");
      } else {
        root.classList.add("wauxmmenu-open");
      }
    }
  }

<script>
  const menuToggleBtn = document.querySelector(".j6pg4-menu-btn");
  if (menuToggleBtn) {
    menuToggleBtn.addEventListener("click", function () {
      const menu = document.querySelector(".j6pg4-menu");
      if (!menu) return;
      const isOpen = menu.classList.toggle("active");
      const icon = this.querySelector(".j6pg4-icon");
      if (icon) {
        icon.textContent = isOpen ? "close" : "menu";
      }
    });
  }

  document.querySelectorAll(".j6pg4-top").forEach(function (button) {
    button.addEventListener("click", function () {
      const group = this.closest(".j6pg4-menu-group");
      if (!group) return;
      const sub = group.querySelector(".j6pg4-sub");
      const isOpen = group.classList.toggle("open");
      this.classList.toggle("active", isOpen);
      const icon = this.querySelector(".j6pg4-icon");
      if (icon) {
        icon.textContent = isOpen ? "expand_less" : "expand_more";
      }
      if (sub) {
        sub.classList.toggle("show", isOpen);
      }
    });
  });
</script>

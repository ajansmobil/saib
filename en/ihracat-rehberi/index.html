<script>
  if (typeof menu3_toggle === "undefined") {
    function menu3_toggle() {
      var root = document.getElementById("menu-3-root");
      if (!root) {
        return;
      }
      if (root.classList.contains("vhys3menu-open")) {
        root.classList.remove("vhys3menu-open");
      } else {
        root.classList.add("vhys3menu-open");
      }
    }
  }

<script>
  const menuToggleBtn = document.querySelector(".e59fa-menu-btn");
  if (menuToggleBtn) {
    menuToggleBtn.addEventListener("click", function () {
      const menu = document.querySelector(".e59fa-menu");
      if (!menu) return;
      const isOpen = menu.classList.toggle("active");
      const icon = this.querySelector(".e59fa-icon");
      if (icon) {
        icon.textContent = isOpen ? "close" : "menu";
      }
    });
  }

  document.querySelectorAll(".e59fa-top").forEach(function (button) {
    button.addEventListener("click", function () {
      const group = this.closest(".e59fa-menu-group");
      if (!group) return;
      const sub = group.querySelector(".e59fa-sub");
      const isOpen = group.classList.toggle("open");
      this.classList.toggle("active", isOpen);
      const icon = this.querySelector(".e59fa-icon");
      if (icon) {
        icon.textContent = isOpen ? "expand_less" : "expand_more";
      }
      if (sub) {
        sub.classList.toggle("show", isOpen);
      }
    });
  });
</script>
